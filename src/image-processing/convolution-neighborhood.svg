<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<style>.title{font:700 24px Arial;fill:#111}.label{font:16px Arial;fill:#222}.small{font:13px Arial;fill:#333}.cell{fill:#f8fafc;stroke:#334155;stroke-width:2}.center{fill:#fde68a;stroke:#92400e;stroke-width:3}.kernel{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}.arrow{stroke:#111827;stroke-width:3;marker-end:url(#arrow)}.out{fill:#dcfce7;stroke:#166534;stroke-width:3}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
<text x="30" y="42" class="title">Convolution: one output pixel from a local neighborhood</text>
<text x="95" y="85" class="label">Source pixels around (x, y)</text>
<g transform="translate(70,110)">
<rect class="cell" x="0" y="0" width="70" height="70"/><rect class="cell" x="70" y="0" width="70" height="70"/><rect class="cell" x="140" y="0" width="70" height="70"/>
<rect class="cell" x="0" y="70" width="70" height="70"/><rect class="center" x="70" y="70" width="70" height="70"/><rect class="cell" x="140" y="70" width="70" height="70"/>
<rect class="cell" x="0" y="140" width="70" height="70"/><rect class="cell" x="70" y="140" width="70" height="70"/><rect class="cell" x="140" y="140" width="70" height="70"/>
<text x="105" y="112" text-anchor="middle" dominant-baseline="middle" class="label">I(x,y)</text></g>
<line class="arrow" x1="310" y1="215" x2="390" y2="215"/><text x="350" y="195" text-anchor="middle" class="small">multiply by</text>
<text x="430" y="85" class="label">Kernel weights K</text>
<g transform="translate(410,110)">
<rect class="kernel" x="0" y="0" width="55" height="55"/><rect class="kernel" x="55" y="0" width="55" height="55"/><rect class="kernel" x="110" y="0" width="55" height="55"/>
<rect class="kernel" x="0" y="55" width="55" height="55"/><rect class="kernel" x="55" y="55" width="55" height="55"/><rect class="kernel" x="110" y="55" width="55" height="55"/>
<rect class="kernel" x="0" y="110" width="55" height="55"/><rect class="kernel" x="55" y="110" width="55" height="55"/><rect class="kernel" x="110" y="110" width="55" height="55"/>
<text x="27.5" y="32" text-anchor="middle" class="small">k00</text><text x="82.5" y="32" text-anchor="middle" class="small">k01</text><text x="137.5" y="32" text-anchor="middle" class="small">k02</text>
<text x="27.5" y="87" text-anchor="middle" class="small">k10</text><text x="82.5" y="87" text-anchor="middle" class="small">k11</text><text x="137.5" y="87" text-anchor="middle" class="small">k12</text>
<text x="27.5" y="142" text-anchor="middle" class="small">k20</text><text x="82.5" y="142" text-anchor="middle" class="small">k21</text><text x="137.5" y="142" text-anchor="middle" class="small">k22</text></g>
<line class="arrow" x1="600" y1="215" x2="690" y2="215"/><text x="645" y="195" text-anchor="middle" class="small">sum + normalize</text>
<text x="720" y="85" class="label">Output pixel O(x,y)</text><rect class="out" x="735" y="155" width="95" height="95"/><text x="782.5" y="208" text-anchor="middle" class="label">O(x,y)</text>
<text x="70" y="365" class="label">Code mapping: applyKernel loops over ky/kx, samples sourcePixels, multiplies by weight, and writes one target pixel.</text>
</svg>