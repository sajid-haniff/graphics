<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
<style>.title{font:700 24px Arial;fill:#111}.label{font:16px Arial;fill:#222}.small{font:13px Arial;fill:#333}.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:10}.code{font:14px monospace;fill:#111}.arrow{stroke:#111827;stroke-width:3;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
<text x="30" y="42" class="title">Implementation pipeline in convolution.js</text>
<rect x="40" y="95" width="160" height="80" class="box"/><text x="120" y="124" text-anchor="middle" class="label">KERNELS</text><text x="120" y="150" text-anchor="middle" class="small">matrix + divisor</text>
<line class="arrow" x1="215" y1="135" x2="290" y2="135"/><rect x="305" y="95" width="170" height="80" class="box"/><text x="390" y="124" text-anchor="middle" class="label">applyConvolution</text><text x="390" y="150" text-anchor="middle" class="small">iterate every pixel</text>
<line class="arrow" x1="490" y1="135" x2="565" y2="135"/><rect x="580" y="95" width="155" height="80" class="box"/><text x="657.5" y="124" text-anchor="middle" class="label">applyKernel</text><text x="657.5" y="150" text-anchor="middle" class="small">compute one pixel</text>
<line class="arrow" x1="750" y1="135" x2="825" y2="135"/><rect x="840" y="95" width="95" height="80" class="box"/><text x="887.5" y="124" text-anchor="middle" class="label">output</text><text x="887.5" y="150" text-anchor="middle" class="small">p5.Image</text>
<rect x="90" y="235" width="780" height="110" class="box"/><text x="115" y="270" class="code">for y in height:</text><text x="115" y="295" class="code">  for x in width:</text><text x="115" y="320" class="code">    applyKernel(sourcePixels, outputPixels, width, height, x, y, matrix, divisor, offset)</text>
<text x="90" y="380" class="label">Full-image traversal and single-pixel convolution are separated.</text>
</svg>