<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<style>.title{font:700 24px Arial;fill:#111}.label{font:16px Arial;fill:#222}.small{font:13px Arial;fill:#333}.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:8}.math{font:18px monospace;fill:#111}.arrow{stroke:#111827;stroke-width:3;marker-end:url(#arrow)}.green{fill:#dcfce7;stroke:#166534;stroke-width:2;rx:8}.blue{fill:#e0f2fe;stroke:#0369a1;stroke-width:2;rx:8}.orange{fill:#ffedd5;stroke:#c2410c;stroke-width:2;rx:8}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
<text x="30" y="42" class="title">Accumulation for one color channel</text>
<rect x="40" y="85" width="210" height="70" class="box"/><text x="145" y="126" text-anchor="middle" class="math">pixel0 * weight0</text>
<rect x="40" y="175" width="210" height="70" class="box"/><text x="145" y="216" text-anchor="middle" class="math">pixel1 * weight1</text>
<rect x="40" y="265" width="210" height="70" class="box"/><text x="145" y="306" text-anchor="middle" class="math">...</text>
<line class="arrow" x1="270" y1="120" x2="365" y2="205"/><line class="arrow" x1="270" y1="210" x2="365" y2="220"/><line class="arrow" x1="270" y1="300" x2="365" y2="235"/>
<rect x="380" y="170" width="160" height="90" class="blue"/><text x="460" y="205" text-anchor="middle" class="math">sum</text><text x="460" y="232" text-anchor="middle" class="small">r, g, b accumulators</text>
<line class="arrow" x1="555" y1="215" x2="650" y2="215"/><rect x="665" y="165" width="175" height="100" class="orange"/><text x="752" y="198" text-anchor="middle" class="math">sum / divisor</text><text x="752" y="224" text-anchor="middle" class="math">+ offset</text><text x="752" y="248" text-anchor="middle" class="small">clamp [0,255]</text>
<line class="arrow" x1="752" y1="270" x2="752" y2="335"/><rect x="655" y="345" width="195" height="55" class="green"/><text x="752" y="379" text-anchor="middle" class="math">targetPixels[index]</text>
<text x="40" y="410" class="label">The same operation is repeated for R, G, and B. Alpha is copied from the source center pixel.</text>
</svg>