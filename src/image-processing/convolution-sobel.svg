<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<style>.title{font:700 24px Arial;fill:#111}.label{font:16px Arial;fill:#222}.small{font:13px Arial;fill:#333}.arrow{stroke:#111827;stroke-width:3;marker-end:url(#arrow)}.cell{stroke:#334155;stroke-width:1}.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:8}.kernel{font:16px monospace;fill:#111}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
<text x="30" y="42" class="title">Sobel filters estimate directional brightness change</text>
<text x="70" y="88" class="label">Image patch: dark to light</text>
<g transform="translate(80,115)">
<rect class="cell" x="0" y="0" width="60" height="60" fill="#111827"/><rect class="cell" x="60" y="0" width="60" height="60" fill="#64748b"/><rect class="cell" x="120" y="0" width="60" height="60" fill="#f8fafc"/>
<rect class="cell" x="0" y="60" width="60" height="60" fill="#111827"/><rect class="cell" x="60" y="60" width="60" height="60" fill="#64748b"/><rect class="cell" x="120" y="60" width="60" height="60" fill="#f8fafc"/>
<rect class="cell" x="0" y="120" width="60" height="60" fill="#111827"/><rect class="cell" x="60" y="120" width="60" height="60" fill="#64748b"/><rect class="cell" x="120" y="120" width="60" height="60" fill="#f8fafc"/></g>
<line class="arrow" x1="300" y1="205" x2="410" y2="205"/><text x="355" y="185" class="small" text-anchor="middle">apply Sobel X</text>
<rect x="430" y="105" width="180" height="205" class="box"/><text x="520" y="135" text-anchor="middle" class="label">Sobel X</text>
<text x="520" y="175" text-anchor="middle" class="kernel">-1   0   1</text><text x="520" y="215" text-anchor="middle" class="kernel">-2   0   2</text><text x="520" y="255" text-anchor="middle" class="kernel">-1   0   1</text>
<line class="arrow" x1="630" y1="205" x2="735" y2="205"/><rect x="750" y="150" width="95" height="95" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><text x="797.5" y="188" text-anchor="middle" class="label">large</text><text x="797.5" y="213" text-anchor="middle" class="label">response</text>
<text x="80" y="365" class="label">Negative weights on the left and positive weights on the right respond strongly to vertical edges.</text>
</svg>