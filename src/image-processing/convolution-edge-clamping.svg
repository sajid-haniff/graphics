<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<style>.title{font:700 24px Arial;fill:#111}.label{font:16px Arial;fill:#222}.small{font:13px Arial;fill:#333}.cell{fill:#f8fafc;stroke:#334155;stroke-width:2}.outside{fill:#fee2e2;stroke:#b91c1c;stroke-width:2;stroke-dasharray:6 4}.center{fill:#fde68a;stroke:#92400e;stroke-width:3}.arrow{stroke:#111827;stroke-width:3;marker-end:url(#arrow)}.clamped{fill:#dcfce7;stroke:#166534;stroke-width:3}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
<text x="30" y="42" class="title">Edge handling: clamp missing samples</text>
<text x="70" y="85" class="label">Kernel centered on top-left pixel (0,0)</text>
<g transform="translate(100,120)">
<rect class="outside" x="-70" y="-70" width="70" height="70"/><rect class="outside" x="0" y="-70" width="70" height="70"/><rect class="outside" x="70" y="-70" width="70" height="70"/>
<rect class="outside" x="-70" y="0" width="70" height="70"/><rect class="center" x="0" y="0" width="70" height="70"/><rect class="cell" x="70" y="0" width="70" height="70"/>
<rect class="outside" x="-70" y="70" width="70" height="70"/><rect class="cell" x="0" y="70" width="70" height="70"/><rect class="cell" x="70" y="70" width="70" height="70"/>
<text x="35" y="39" text-anchor="middle" class="small">(0,0)</text></g>
<line class="arrow" x1="310" y1="210" x2="450" y2="210"/><text x="380" y="190" text-anchor="middle" class="small">clamp to image bounds</text>
<text x="505" y="85" class="label">Invalid sample (-1,-1) becomes (0,0)</text>
<g transform="translate(560,120)">
<rect class="clamped" x="0" y="0" width="80" height="80"/><rect class="cell" x="80" y="0" width="80" height="80"/><rect class="cell" x="0" y="80" width="80" height="80"/><rect class="cell" x="80" y="80" width="80" height="80"/>
<text x="40" y="45" text-anchor="middle" class="small">(0,0)</text><text x="120" y="45" text-anchor="middle" class="small">(1,0)</text><text x="40" y="125" text-anchor="middle" class="small">(0,1)</text><text x="120" y="125" text-anchor="middle" class="small">(1,1)</text></g>
<text x="70" y="360" class="label">Code mapping: sampleX = clamp(x + kx - center, 0, width - 1), sampleY similarly.</text>
</svg>