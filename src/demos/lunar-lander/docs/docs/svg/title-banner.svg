<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#0a1530"/>
      <stop offset="60%" stop-color="#050b1c"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#a8f4ff"/>
      <stop offset="100%" stop-color="#00b8d8"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff9be6"/>
      <stop offset="100%" stop-color="#ff2dff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bgGlow)"/>

  <!-- Starfield -->
  <g fill="#cfe8ff" opacity="0.9">
    <circle cx="80" cy="40" r="1"/><circle cx="200" cy="80" r="0.8"/><circle cx="340" cy="30" r="1.4"/>
    <circle cx="500" cy="70" r="0.7"/><circle cx="650" cy="25" r="1"/><circle cx="780" cy="90" r="1.2"/>
    <circle cx="920" cy="40" r="0.8"/><circle cx="1080" cy="65" r="1.4"/><circle cx="150" cy="160" r="0.9"/>
    <circle cx="1050" cy="180" r="1"/><circle cx="60" cy="250" r="1.2"/><circle cx="1140" cy="280" r="0.8"/>
    <circle cx="280" cy="280" r="0.7"/><circle cx="430" cy="320" r="0.9"/><circle cx="970" cy="310" r="1.1"/>
  </g>
  <g fill="#ff99ff" opacity="0.5">
    <circle cx="120" cy="120" r="1.6"/><circle cx="880" cy="140" r="1.4"/><circle cx="600" cy="260" r="1.6"/>
  </g>

  <!-- Distant planet curve -->
  <path d="M -50 360 Q 600 220 1250 360 Z" fill="#0a1a2e" opacity="0.55"/>
  <path d="M -50 360 Q 600 240 1250 360" fill="none" stroke="#5577aa" stroke-width="1.2" opacity="0.7"/>

  <!-- Lander -->
  <g transform="translate(870 195)" filter="url(#glow)">
    <g stroke="url(#cyan)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polygon points="-10,-18 10,-18 16,-2 10,16 -10,16 -16,-2"/>
      <line x1="-10" y1="16" x2="-22" y2="30"/>
      <line x1="-22" y1="30" x2="-28" y2="34"/>
      <line x1="-16" y1="30" x2="-28" y2="34"/>
      <line x1="10" y1="16" x2="22" y2="30"/>
      <line x1="22" y1="30" x2="28" y2="34"/>
      <line x1="16" y1="30" x2="28" y2="34"/>
    </g>
    <!-- Plume -->
    <g opacity="0.9">
      <path d="M -6 18 Q 0 38 6 18" fill="#ffdd66"/>
      <path d="M -4 22 Q 0 50 4 22" fill="#ff9933" opacity="0.7"/>
    </g>
  </g>

  <!-- Pad -->
  <g transform="translate(840 305)">
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#44ff88" stroke-width="2.5"/>
    <line x1="-40" y1="0" x2="-40" y2="-8" stroke="#44ff88" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="-8" stroke="#44ff88" stroke-width="2"/>
  </g>

  <!-- Title -->
  <g filter="url(#glow)">
    <text x="80" y="170" font-size="84" font-weight="700" fill="url(#cyan)" letter-spacing="2">LUNAR</text>
    <text x="80" y="252" font-size="84" font-weight="700" fill="url(#magenta)" letter-spacing="2">LANDER</text>
  </g>
  <text x="84" y="290" font-size="14" fill="#7da6c8" letter-spacing="6">VECTOR · CRT · NEON</text>
  <text x="84" y="315" font-size="12" fill="#4e6a8a" letter-spacing="3">A p5.js remake — physics, terrain, and rendering documented</text>
</svg>
