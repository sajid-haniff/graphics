<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="ui-monospace, monospace">
  <rect width="1200" height="620" fill="#040810"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" fill="#bbccee" letter-spacing="4">SLOPE LIMITING — TWO-SWEEP LIPSCHITZ ENFORCEMENT</text>
  <text x="600" y="56" text-anchor="middle" font-size="11" fill="#6b8aa8">enforce |h[i+1] − h[i]| ≤ s · dx     ·     forward sweep + reverse sweep ⇒ converged</text>

  <!-- BEFORE -->
  <g transform="translate(80 110)">
    <rect width="1040" height="140" rx="8" fill="#06121e" stroke="#ff4466" stroke-width="1.2"/>
    <text x="20" y="22" font-size="12" fill="#ff8899" font-weight="600">BEFORE — raw fBm + landforms · jagged spikes &amp; sheer cliffs</text>
    <polyline points="40,120 90,110 140,80 190,50 240,40 290,100 340,30 390,90 440,40 490,60 540,40 590,110 640,40 690,90 740,60 790,70 810,30 870,100 920,70 970,50 1020,90"
              fill="none" stroke="#ff6688" stroke-width="1.6"/>
    <!-- mark violations -->
    <g fill="#ff4466">
      <circle cx="240" cy="40" r="4"/>
      <circle cx="290" cy="100" r="4"/>
      <circle cx="340" cy="30" r="4"/>
      <circle cx="810" cy="30" r="4"/>
    </g>
  </g>

  <!-- FORWARD -->
  <g transform="translate(80 270)">
    <rect width="1040" height="140" rx="8" fill="#06121e" stroke="#ffcc00" stroke-width="1.2"/>
    <text x="20" y="22" font-size="12" fill="#ffcc00" font-weight="600">FORWARD SWEEP — clamp h[i+1] − h[i] from the left</text>
    <polyline points="40,120 90,110 140,80 190,50 240,40 290,80 340,50 390,80 440,60 490,70 540,55 590,75 640,55 690,75 740,65 790,75 810,55 870,80 920,70 970,60 1020,80"
              fill="none" stroke="#ffcc44" stroke-width="1.6"/>
    <text x="20" y="124" font-size="9" fill="#a89050">arrow → direction of sweep</text>
    <g stroke="#ffcc44" stroke-width="1" fill="none">
      <path d="M 980 110 L 1010 110 M 1004 106 L 1010 110 L 1004 114"/>
    </g>
  </g>

  <!-- REVERSE -->
  <g transform="translate(80 430)">
    <rect width="1040" height="140" rx="8" fill="#06121e" stroke="#44ff88" stroke-width="1.4"/>
    <text x="20" y="22" font-size="12" fill="#44ff88" font-weight="600">REVERSE SWEEP — clamp from the right · result is Lipschitz from both sides</text>
    <polyline points="40,118 90,108 140,80 190,55 240,45 290,68 340,55 390,75 440,62 490,72 540,58 590,74 640,58 690,74 740,66 790,74 810,60 870,76 920,70 970,62 1020,76"
              fill="none" stroke="#88ff88" stroke-width="2"/>
    <g stroke="#88ff88" stroke-width="1" fill="none">
      <path d="M 70 110 L 40 110 M 46 106 L 40 110 L 46 114"/>
    </g>
    <text x="20" y="124" font-size="9" fill="#608060">arrow ← direction of sweep</text>
  </g>

  <!-- Bottom annotation -->
  <g transform="translate(80 590)">
    <text x="0" y="0" font-size="10" fill="#7090b0">Idempotent: a 3rd sweep changes nothing — the inequality holds globally after two passes.</text>
  </g>
</svg>
