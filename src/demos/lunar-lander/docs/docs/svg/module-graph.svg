<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="ui-monospace, monospace">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#88aacc"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#040810"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" fill="#bbccee" letter-spacing="5">MODULE GRAPH — IMPORT DEPENDENCIES</text>
  <text x="600" y="58" text-anchor="middle" font-size="11" fill="#6b8aa8">arrows point from dependant → dependency</text>

  <!-- Main hub -->
  <g transform="translate(600 360)">
    <rect x="-140" y="-30" width="280" height="60" rx="8" fill="#1a1428" stroke="#bb88ff" stroke-width="2"/>
    <text y="-6" text-anchor="middle" font-size="14" fill="#bb88ff" font-weight="600">lunar-lander-demo.js</text>
    <text y="14" text-anchor="middle" font-size="10" fill="#a080c0">factory · game loop · state machine · HUD</text>
  </g>

  <!-- Top row: physics -->
  <g transform="translate(280 180)">
    <rect x="-90" y="-26" width="180" height="52" rx="6" fill="#0a2030" stroke="#00eeff" stroke-width="1.4"/>
    <text y="-4" text-anchor="middle" font-size="12" fill="#00eeff" font-weight="600">lander-dynamics.js</text>
    <text y="14" text-anchor="middle" font-size="10" fill="#88c8e0">step · classifyTouchdown</text>
  </g>
  <g transform="translate(600 130)">
    <rect x="-90" y="-26" width="180" height="52" rx="6" fill="#1a0820" stroke="#ff66cc" stroke-width="1.4"/>
    <text y="-4" text-anchor="middle" font-size="12" fill="#ff66cc" font-weight="600">terrain.js</text>
    <text y="14" text-anchor="middle" font-size="10" fill="#e0a0d8">fBm + Gaussian + chunks</text>
  </g>
  <g transform="translate(920 180)">
    <rect x="-90" y="-26" width="180" height="52" rx="6" fill="#202008" stroke="#ffcc00" stroke-width="1.4"/>
    <text y="-4" text-anchor="middle" font-size="12" fill="#ffcc00" font-weight="600">planet-profiles.js</text>
    <text y="14" text-anchor="middle" font-size="10" fill="#e8c870">5 worlds · physics + hazards</text>
  </g>

  <!-- Mid row: agents -->
  <g transform="translate(180 360)">
    <rect x="-90" y="-26" width="180" height="52" rx="6" fill="#28140a" stroke="#ff8844" stroke-width="1.4"/>
    <text y="-4" text-anchor="middle" font-size="12" fill="#ff8844" font-weight="600">lunar-particles.js</text>
    <text y="14" text-anchor="middle" font-size="10" fill="#e0a070">plume · dust · pad-pulses</text>
  </g>
  <g transform="translate(1020 360)">
    <rect x="-90" y="-26" width="180" height="52" rx="6" fill="#28140a" stroke="#ff8844" stroke-width="1.4"/>
    <text y="-4" text-anchor="middle" font-size="12" fill="#ff8844" font-weight="600">lander-explosion.js</text>
    <text y="14" text-anchor="middle" font-size="10" fill="#e0a070">vector fragment burst</text>
  </g>

  <!-- Bottom row: environment + utils -->
  <g transform="translate(180 540)">
    <rect x="-90" y="-26" width="180" height="52" rx="6" fill="#102818" stroke="#44ff88" stroke-width="1.4"/>
    <text y="-4" text-anchor="middle" font-size="12" fill="#44ff88" font-weight="600">environment-effects.js</text>
    <text y="14" text-anchor="middle" font-size="10" fill="#80e0a0">aurora · debris orchestration</text>
  </g>
  <g transform="translate(420 540)">
    <rect x="-90" y="-26" width="180" height="52" rx="6" fill="#102818" stroke="#44ff88" stroke-width="1.4"/>
    <text y="-4" text-anchor="middle" font-size="12" fill="#44ff88" font-weight="600">neon-debris.js</text>
    <text y="14" text-anchor="middle" font-size="10" fill="#80e0a0">hazards spawned by env</text>
  </g>
  <g transform="translate(660 540)">
    <rect x="-90" y="-26" width="180" height="52" rx="6" fill="#102818" stroke="#44ff88" stroke-width="1.4"/>
    <text y="-4" text-anchor="middle" font-size="12" fill="#44ff88" font-weight="600">starfield.js</text>
    <text y="14" text-anchor="middle" font-size="10" fill="#80e0a0">parallax layered stars</text>
  </g>
  <g transform="translate(900 540)">
    <rect x="-90" y="-26" width="180" height="52" rx="6" fill="#102030" stroke="#7090b8" stroke-width="1.4"/>
    <text y="-4" text-anchor="middle" font-size="12" fill="#90b0d8" font-weight="600">color-profiles.js</text>
    <text y="14" text-anchor="middle" font-size="10" fill="#6080a0">palette role lookup</text>
  </g>
  <g transform="translate(1120 540)">
    <rect x="-70" y="-26" width="140" height="52" rx="6" fill="#102030" stroke="#7090b8" stroke-width="1.4"/>
    <text y="-4" text-anchor="middle" font-size="11" fill="#90b0d8" font-weight="600">sfx-map.js</text>
    <text y="14" text-anchor="middle" font-size="9" fill="#6080a0">audio events</text>
  </g>

  <!-- Lib row -->
  <g transform="translate(420 660)">
    <rect x="-80" y="-22" width="160" height="44" rx="6" fill="#0a0a14" stroke="#5e7da0" stroke-width="1.2"/>
    <text y="0" text-anchor="middle" font-size="11" fill="#a0c0e0" font-weight="600">V (vector math)</text>
    <text y="14" text-anchor="middle" font-size="9" fill="#6688aa">add · sub · scale · norm</text>
  </g>
  <g transform="translate(660 660)">
    <rect x="-80" y="-22" width="160" height="44" rx="6" fill="#0a0a14" stroke="#5e7da0" stroke-width="1.2"/>
    <text y="0" text-anchor="middle" font-size="11" fill="#a0c0e0" font-weight="600">M2D (matrices)</text>
    <text y="14" text-anchor="middle" font-size="9" fill="#6688aa">multiply · compose</text>
  </g>
  <g transform="translate(900 660)">
    <rect x="-80" y="-22" width="160" height="44" rx="6" fill="#0a0a14" stroke="#5e7da0" stroke-width="1.2"/>
    <text y="0" text-anchor="middle" font-size="11" fill="#a0c0e0" font-weight="600">sk (p5 wrapper)</text>
    <text y="14" text-anchor="middle" font-size="9" fill="#6688aa">all draw calls</text>
  </g>

  <!-- Arrows from demo to top row -->
  <g fill="none" stroke="#88aacc" stroke-width="1.3" marker-end="url(#ar3)" opacity="0.85">
    <line x1="500" y1="340" x2="350" y2="208"/>
    <line x1="600" y1="330" x2="600" y2="160"/>
    <line x1="700" y1="340" x2="850" y2="208"/>
    <line x1="490" y1="360" x2="278" y2="360"/>
    <line x1="710" y1="360" x2="922" y2="360"/>
    <line x1="500" y1="380" x2="270" y2="514"/>
    <line x1="540" y1="386" x2="500" y2="514"/>
    <line x1="610" y1="390" x2="660" y2="514"/>
    <line x1="700" y1="380" x2="900" y2="514"/>
    <line x1="720" y1="370" x2="1080" y2="520"/>
  </g>
  <!-- Cross deps -->
  <g fill="none" stroke="#5e7da0" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#ar3)" opacity="0.75">
    <line x1="180" y1="386" x2="180" y2="514"/>
    <line x1="420" y1="566" x2="420" y2="640"/>
    <line x1="660" y1="566" x2="660" y2="640"/>
    <line x1="600" y1="156" x2="660" y2="640" stroke-dasharray="2 4" opacity="0.45"/>
    <line x1="900" y1="566" x2="900" y2="640"/>
  </g>

  <!-- Legend -->
  <g transform="translate(60 90)" font-size="10">
    <text y="0" fill="#a0b8d8" font-weight="600">LAYERS</text>
    <g transform="translate(0 16)"><rect width="14" height="10" fill="#0a2030" stroke="#00eeff"/><text x="20" y="9" fill="#88c8e0">physics</text></g>
    <g transform="translate(0 32)"><rect width="14" height="10" fill="#1a0820" stroke="#ff66cc"/><text x="20" y="9" fill="#e0a0d8">world</text></g>
    <g transform="translate(0 48)"><rect width="14" height="10" fill="#28140a" stroke="#ff8844"/><text x="20" y="9" fill="#e0a070">agents</text></g>
    <g transform="translate(0 64)"><rect width="14" height="10" fill="#102818" stroke="#44ff88"/><text x="20" y="9" fill="#80e0a0">env / bg</text></g>
    <g transform="translate(0 80)"><rect width="14" height="10" fill="#102030" stroke="#7090b8"/><text x="20" y="9" fill="#90b0d8">config</text></g>
    <g transform="translate(0 96)"><rect width="14" height="10" fill="#0a0a14" stroke="#5e7da0"/><text x="20" y="9" fill="#a0c0e0">utils</text></g>
  </g>
</svg>
