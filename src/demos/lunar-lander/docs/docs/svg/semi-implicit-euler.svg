<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="ui-monospace, monospace">
  <defs>
    <marker id="arE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#88ddff"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#040810"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" fill="#bbccee" letter-spacing="4">SEMI-IMPLICIT EULER — A SYMPLECTIC ONE-LINER</text>
  <text x="600" y="56" text-anchor="middle" font-size="11" fill="#6b8aa8">harmonic oscillator (mass-spring) — same dt, same initial energy</text>

  <!-- Math panel -->
  <g transform="translate(80 90)">
    <rect width="1040" height="120" rx="8" fill="#06121e" stroke="#2c4a6e" stroke-width="1"/>
    <text x="20" y="28" font-size="13" fill="#a0c0e0" font-weight="600">UPDATE RULES</text>

    <text x="20" y="58" font-size="12" fill="#ff8888">EXPLICIT EULER</text>
    <text x="180" y="58" font-size="12" fill="#ffaaaa">x ← x + v · dt            v ← v + a(x) · dt</text>
    <text x="180" y="78" font-size="10" fill="#a86060">a(x) is evaluated at the OLD position — energy grows in oscillators</text>

    <text x="20" y="100" font-size="12" fill="#88ff88">SEMI-IMPLICIT EULER</text>
    <text x="180" y="100" font-size="12" fill="#aaffaa">v ← v + a(x) · dt         x ← x + v · dt</text>
    <text x="180" y="118" font-size="10" fill="#80c080">velocity updated first — position uses the NEW velocity — symplectic, energy bounded</text>
  </g>

  <!-- Two phase-space spirals -->
  <g transform="translate(180 400)">
    <text x="160" y="-170" text-anchor="middle" font-size="14" fill="#ff8888" font-weight="600">EXPLICIT EULER · phase portrait</text>
    <text x="160" y="-152" text-anchor="middle" font-size="10" fill="#a86060">unbounded spiral outward</text>

    <line x1="-150" y1="0" x2="170" y2="0" stroke="#5e7da0" stroke-width="0.8"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#5e7da0" stroke-width="0.8"/>
    <text x="170" y="-6" font-size="10" fill="#7090b0">x</text>
    <text x="6" y="-130" font-size="10" fill="#7090b0">v</text>

    <!-- Expanding spiral -->
    <path d="M 20 0
             Q 22 20 0 22
             Q -28 28 -32 0
             Q -38 -38 0 -42
             Q 50 -48 56 0
             Q 64 64 0 70
             Q -80 78 -88 0
             Q -98 -100 0 -112"
          fill="none" stroke="#ff5566" stroke-width="1.6" opacity="0.9"/>

    <circle cx="20" cy="0" r="2.5" fill="#ffaaaa"/>
  </g>

  <g transform="translate(820 400)">
    <text x="0" y="-170" text-anchor="middle" font-size="14" fill="#88ff88" font-weight="600">SEMI-IMPLICIT EULER · phase portrait</text>
    <text x="0" y="-152" text-anchor="middle" font-size="10" fill="#80c080">closed loop · bounded energy</text>

    <line x1="-160" y1="0" x2="160" y2="0" stroke="#5e7da0" stroke-width="0.8"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#5e7da0" stroke-width="0.8"/>
    <text x="160" y="-6" font-size="10" fill="#7090b0">x</text>
    <text x="6" y="-130" font-size="10" fill="#7090b0">v</text>

    <!-- Closed orbit (slightly off-circular polygon — discrete steps stay on a loop) -->
    <polygon points="100,0 88,40 56,72 18,90 -18,90 -56,72 -88,40 -100,0 -88,-40 -56,-72 -18,-90 18,-90 56,-72 88,-40"
             fill="none" stroke="#44ff88" stroke-width="1.8"/>

    <!-- step dots -->
    <g fill="#aaffaa">
      <circle cx="100" cy="0" r="2.4"/><circle cx="88" cy="40" r="2.4"/><circle cx="56" cy="72" r="2.4"/>
      <circle cx="18" cy="90" r="2.4"/><circle cx="-18" cy="90" r="2.4"/><circle cx="-56" cy="72" r="2.4"/>
      <circle cx="-88" cy="40" r="2.4"/><circle cx="-100" cy="0" r="2.4"/>
    </g>
  </g>

  <!-- Bottom callout -->
  <g transform="translate(80 560)">
    <rect width="1040" height="60" rx="8" fill="#06121e" stroke="#2c4a6e" stroke-width="1"/>
    <text x="20" y="22" font-size="12" fill="#a0c0e0" font-weight="600">WHY IT MATTERS HERE</text>
    <text x="20" y="42" font-size="10" fill="#7090b0">The lander spends its life under gravity (conservative force) with thrust adding controlled energy. Semi-implicit Euler keeps long, hovering descents</text>
    <text x="20" y="56" font-size="10" fill="#7090b0">numerically stable — bouncy explicit Euler would gradually fling the ship to the moon. One swap of line order, free symplectic behaviour.</text>
  </g>
</svg>
