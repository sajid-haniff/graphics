<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="ui-monospace, monospace">
  <rect width="1200" height="720" fill="#040810"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" fill="#bbccee" letter-spacing="4">HUD LAYOUT — INFORMATION AT A GLANCE</text>

  <!-- Mock game frame -->
  <g transform="translate(80 80)">
    <rect width="1040" height="580" rx="6" fill="#040810" stroke="#3a5a80" stroke-width="1.4"/>

    <!-- Background terrain -->
    <path d="M 0 460 L 80 430 L 160 450 L 250 400 L 340 440 L 420 380 L 520 420 L 610 360 L 700 410 L 800 440 L 880 410 L 960 430 L 1040 410 L 1040 580 L 0 580 Z"
          fill="#0a1428" stroke="#5588cc" stroke-width="1"/>
    <line x1="420" y1="380" x2="500" y2="400" stroke="#44ff88" stroke-width="3"/>

    <!-- Lander in world -->
    <g transform="translate(460 280)">
      <polygon points="-14,18 14,18 12,-16 -12,-16" fill="none" stroke="#00eeff" stroke-width="2"/>
      <line x1="-14" y1="18" x2="-22" y2="32" stroke="#00eeff" stroke-width="2"/>
      <line x1="14" y1="18" x2="22" y2="32" stroke="#00eeff" stroke-width="2"/>
      <line x1="0" y1="20" x2="0" y2="38" stroke="#ffcc44" stroke-width="2.5"/>
    </g>

    <!-- Stars -->
    <g fill="#aabbdd" opacity="0.7">
      <circle cx="80" cy="60" r="1"/><circle cx="300" cy="80" r="0.8"/><circle cx="500" cy="40" r="1.2"/>
      <circle cx="700" cy="60" r="0.7"/><circle cx="900" cy="50" r="1"/><circle cx="180" cy="180" r="0.9"/>
      <circle cx="800" cy="170" r="0.8"/><circle cx="970" cy="220" r="1.1"/>
    </g>

    <!-- HUD elements -->
    <!-- top-left: telemetry -->
    <g transform="translate(30 40)" font-size="13" fill="#e8c870">
      <text y="0">ALT     142</text>
      <text y="20">VY      -1.4</text>
      <text y="40">VX       0.6</text>
      <text y="60">FUEL     62%</text>
    </g>

    <!-- top-right: score / lives -->
    <g transform="translate(880 40)" font-size="13" fill="#bbccee">
      <text y="0">SCORE  01480</text>
      <text y="20">ROUND      3</text>
      <text y="40">LIVES  ▲ ▲ ▲</text>
    </g>

    <!-- center-top: warning -->
    <g transform="translate(520 30)">
      <rect width="0" height="0"/>
    </g>

    <!-- bottom: fuel bar -->
    <g transform="translate(30 540)">
      <rect width="400" height="10" fill="none" stroke="#e8c870" stroke-width="1.2"/>
      <rect width="248" height="10" fill="#e8c870" opacity="0.7"/>
    </g>

    <!-- center pad indicator -->
    <g transform="translate(460 80)">
      <polygon points="0,-8 -10,8 10,8" fill="none" stroke="#ff66cc" stroke-width="1.5"/>
      <text x="0" y="26" text-anchor="middle" font-size="9" fill="#ff66cc">PAD 3×</text>
    </g>

    <!-- velocity warning -->
    <g transform="translate(840 60)">
      <rect x="-50" y="-10" width="100" height="22" fill="none" stroke="#ff4466" stroke-width="1.4"/>
      <text x="0" y="6" text-anchor="middle" font-size="11" fill="#ff7788">DESCENT</text>
    </g>
  </g>

  <!-- Annotation labels around the frame -->
  <g font-size="11" fill="#a0c0e0">
    <!-- top-left -->
    <line x1="80" y1="100" x2="40" y2="100" stroke="#88aacc" stroke-width="0.8"/>
    <text x="20" y="104" text-anchor="end" fill="#e8c870">telemetry</text>

    <!-- top-right -->
    <line x1="1120" y1="100" x2="1160" y2="100" stroke="#88aacc" stroke-width="0.8"/>
    <text x="1170" y="104" fill="#bbccee">progression</text>

    <!-- pad indicator -->
    <line x1="540" y1="150" x2="580" y2="80" stroke="#88aacc" stroke-width="0.8"/>
    <text x="586" y="78" fill="#ff66cc">pad arrow</text>
    <text x="586" y="92" font-size="9" fill="#c080b8">offscreen targeting</text>

    <!-- warning -->
    <line x1="980" y1="120" x2="1030" y2="120" stroke="#88aacc" stroke-width="0.8"/>
    <text x="1040" y="124" fill="#ff7788">warning box</text>
    <text x="1040" y="138" font-size="9" fill="#c06070">fires when |vy| approaches limit</text>

    <!-- fuel bar -->
    <line x1="120" y1="630" x2="50" y2="680" stroke="#88aacc" stroke-width="0.8"/>
    <text x="40" y="690" text-anchor="end" fill="#e8c870">fuel bar</text>
  </g>

  <!-- Note row -->
  <g transform="translate(80 670)">
    <text x="0" y="0" font-size="10" fill="#7090b0">All HUD elements drawn after sk.resetMatrix() in Pass C — coordinates are screen pixels, untouched by camera or world transforms.</text>
    <text x="0" y="18" font-size="10" fill="#7090b0">The warning box uses a binary threshold; once visible it remains until safe — no visual flicker near the boundary.</text>
  </g>
</svg>
