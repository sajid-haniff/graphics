<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="ui-monospace, monospace">
  <defs>
    <marker id="arT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#88ddff"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#040810"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" fill="#bbccee" letter-spacing="4">RENDERING TRANSFORM PIPELINE</text>
  <text x="600" y="58" text-anchor="middle" font-size="12" fill="#6b8aa8">COMPOSITE = REFLECT_Y · DEVICE · WORLD       (applied right-to-left to a column vector)</text>

  <!-- Four panels -->
  <g font-size="11">
    <!-- World space -->
    <g transform="translate(80 110)">
      <rect width="240" height="240" rx="8" fill="#0a1828" stroke="#00eeff" stroke-width="1.5"/>
      <text x="120" y="22" text-anchor="middle" fill="#00eeff" font-weight="600">WORLD SPACE</text>
      <text x="120" y="38" text-anchor="middle" fill="#88c8e0" font-size="10">Y-up · physics native</text>

      <!-- y-up axes -->
      <line x1="40" y1="200" x2="200" y2="200" stroke="#88aaff" stroke-width="1.5" marker-end="url(#arT)"/>
      <line x1="40" y1="200" x2="40" y2="60" stroke="#88aaff" stroke-width="1.5" marker-end="url(#arT)"/>
      <text x="200" y="220" fill="#a0c0e0">+x</text>
      <text x="20" y="60" fill="#a0c0e0">+y</text>
      <!-- Lander -->
      <g transform="translate(120 140)">
        <polygon points="-8,12 8,12 6,-12 -6,-12" fill="none" stroke="#00eeff" stroke-width="1.5"/>
        <line x1="0" y1="14" x2="0" y2="34" stroke="#ffcc44" stroke-width="2"/>
      </g>
      <text x="120" y="220" text-anchor="middle" fill="#7090b0" font-size="9">v_world = (x, y)</text>
    </g>

    <!-- Device space -->
    <g transform="translate(370 110)">
      <rect width="240" height="240" rx="8" fill="#1a0a30" stroke="#bb88ff" stroke-width="1.5"/>
      <text x="120" y="22" text-anchor="middle" fill="#bb88ff" font-weight="600">DEVICE SPACE</text>
      <text x="120" y="38" text-anchor="middle" fill="#a080c0" font-size="10">camera-relative · still Y-up</text>

      <line x1="120" y1="220" x2="120" y2="60" stroke="#aa88dd" stroke-width="1.5" marker-end="url(#arT)"/>
      <line x1="20" y1="140" x2="220" y2="140" stroke="#aa88dd" stroke-width="1.5" marker-end="url(#arT)"/>
      <text x="220" y="160" fill="#c0a0e0">u</text>
      <text x="100" y="60" fill="#c0a0e0">v</text>
      <g transform="translate(120 140)">
        <polygon points="-8,12 8,12 6,-12 -6,-12" fill="none" stroke="#bb88ff" stroke-width="1.5"/>
      </g>
      <text x="120" y="220" text-anchor="middle" fill="#9070a0" font-size="9">v_dev = DEVICE · v_world</text>
    </g>

    <!-- Reflected (screen) -->
    <g transform="translate(660 110)">
      <rect width="240" height="240" rx="8" fill="#28140a" stroke="#ff8844" stroke-width="1.5"/>
      <text x="120" y="22" text-anchor="middle" fill="#ff8844" font-weight="600">SCREEN SPACE</text>
      <text x="120" y="38" text-anchor="middle" fill="#e0a070" font-size="10">Y-down · pixels</text>

      <line x1="40" y1="60" x2="200" y2="60" stroke="#ffaa66" stroke-width="1.5" marker-end="url(#arT)"/>
      <line x1="40" y1="60" x2="40" y2="220" stroke="#ffaa66" stroke-width="1.5" marker-end="url(#arT)"/>
      <text x="200" y="50" fill="#e0a070">+u</text>
      <text x="20" y="220" fill="#e0a070">+v ↓</text>
      <g transform="translate(120 140)">
        <polygon points="-8,-12 8,-12 6,12 -6,12" fill="none" stroke="#ff8844" stroke-width="1.5"/>
      </g>
      <text x="120" y="220" text-anchor="middle" fill="#a87050" font-size="9">v_screen = R_y · v_dev</text>
    </g>

    <!-- Canvas -->
    <g transform="translate(950 110)">
      <rect width="200" height="240" rx="8" fill="#040810" stroke="#ffffff" stroke-width="1.4"/>
      <text x="100" y="22" text-anchor="middle" fill="#ffffff" font-weight="600">CANVAS</text>
      <text x="100" y="38" text-anchor="middle" fill="#bbccee" font-size="10">final pixel buffer</text>
      <g transform="translate(100 140)">
        <polygon points="-7,-11 7,-11 5,11 -5,11" fill="none" stroke="#ffffff" stroke-width="1.4"/>
      </g>
      <text x="100" y="220" text-anchor="middle" fill="#7090b0" font-size="9">sk.applyMatrix(COMPOSITE)</text>
    </g>
  </g>

  <!-- Arrows between panels -->
  <g fill="none" stroke="#88ddff" stroke-width="1.8" marker-end="url(#arT)">
    <line x1="320" y1="230" x2="370" y2="230"/>
    <line x1="610" y1="230" x2="660" y2="230"/>
    <line x1="900" y1="230" x2="950" y2="230"/>
  </g>
  <g font-size="10" fill="#88ddff">
    <text x="345" y="220" text-anchor="middle">DEVICE</text>
    <text x="635" y="220" text-anchor="middle">REFLECT_Y</text>
    <text x="925" y="220" text-anchor="middle">draw</text>
  </g>

  <!-- Math block -->
  <g transform="translate(120 410)">
    <rect width="960" height="190" rx="10" fill="#06121e" stroke="#2c4a6e" stroke-width="1"/>
    <text x="20" y="32" font-size="13" fill="#a0c0e0" font-weight="600">MATHEMATICS</text>

    <text x="20" y="62" font-size="12" fill="#bbccee">DEVICE        = T(-camera) ∘ S(zoom)            shifts world so camera is origin, then scales</text>
    <text x="20" y="84" font-size="12" fill="#bbccee">REFLECT_Y     = diag(1, -1, 1)                  flips Y so up becomes down (screen)</text>
    <text x="20" y="106" font-size="12" fill="#bbccee">COMPOSITE     = REFLECT_Y · DEVICE · WORLD       full world-to-screen chain</text>

    <text x="20" y="142" font-size="11" fill="#7090b0">INVERSE:  pixelToWorld = COMPOSITE⁻¹     — used for mouse / cursor picking</text>
    <text x="20" y="160" font-size="11" fill="#7090b0">                M2D.makePixelToWorld(COMPOSITE)</text>
    <text x="20" y="180" font-size="11" fill="#7090b0">WORLD is usually identity at frame top — each entity composes its own local transform.</text>
  </g>
</svg>
