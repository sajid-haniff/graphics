<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="ui-monospace, monospace">
  <defs>
    <linearGradient id="ringPhys" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2030"/><stop offset="100%" stop-color="#04101c"/>
    </linearGradient>
    <linearGradient id="ringWorld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a30"/><stop offset="100%" stop-color="#0a0418"/>
    </linearGradient>
    <linearGradient id="ringRender" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#301a08"/><stop offset="100%" stop-color="#180c04"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8d8ff"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#040810"/>

  <text x="600" y="38" text-anchor="middle" font-size="20" fill="#bbccee" letter-spacing="6">ARCHITECTURE OVERVIEW</text>
  <text x="600" y="60" text-anchor="middle" font-size="12" fill="#6c8bb0" letter-spacing="2">factory functions · closure-scoped state · explicit dt · one-direction data flow</text>

  <!-- Frame loop ring -->
  <g transform="translate(600 380)">
    <circle r="320" fill="none" stroke="#1c2e44" stroke-width="0.7" stroke-dasharray="3 4"/>
    <text x="0" y="-330" text-anchor="middle" font-size="11" fill="#5b7a9a" letter-spacing="3">FRAME LOOP @ 60 Hz · dt = 1/60 s</text>
  </g>

  <!-- Input -->
  <g transform="translate(150 220)">
    <rect x="-90" y="-30" width="180" height="60" rx="8" fill="#0a1828" stroke="#86a7d8" stroke-width="1.6"/>
    <text y="-8" text-anchor="middle" font-size="13" fill="#86a7d8" font-weight="600">INPUT</text>
    <text y="10" text-anchor="middle" font-size="10" fill="#6b8aa8">keys → { thrust, rotL, rotR }</text>
    <text y="22" text-anchor="middle" font-size="9" fill="#5a7090" opacity="0.85">pure data — no side effects</text>
  </g>

  <!-- Physics -->
  <g transform="translate(380 220)">
    <rect x="-100" y="-40" width="200" height="80" rx="8" fill="url(#ringPhys)" stroke="#00eeff" stroke-width="1.6"/>
    <text y="-18" text-anchor="middle" font-size="13" fill="#00eeff" font-weight="600">PHYSICS</text>
    <text y="0" text-anchor="middle" font-size="10" fill="#88c8e0">step(state, input, dt, env)</text>
    <text y="14" text-anchor="middle" font-size="9" fill="#6da4c0">semi-implicit Euler · exp-damping</text>
    <text y="26" text-anchor="middle" font-size="9" fill="#5a8eb0" opacity="0.85">lander-dynamics.js</text>
  </g>

  <!-- Terrain -->
  <g transform="translate(620 220)">
    <rect x="-100" y="-40" width="200" height="80" rx="8" fill="url(#ringWorld)" stroke="#ff66cc" stroke-width="1.6"/>
    <text y="-18" text-anchor="middle" font-size="13" fill="#ff66cc" font-weight="600">TERRAIN</text>
    <text y="0" text-anchor="middle" font-size="10" fill="#e0a0d8">fBm + Gaussian landforms</text>
    <text y="14" text-anchor="middle" font-size="9" fill="#c080b8">chunked · deterministic · O(N)</text>
    <text y="26" text-anchor="middle" font-size="9" fill="#a070a0" opacity="0.85">terrain.js</text>
  </g>

  <!-- Agents -->
  <g transform="translate(860 220)">
    <rect x="-100" y="-40" width="200" height="80" rx="8" fill="url(#ringRender)" stroke="#ffcc00" stroke-width="1.6"/>
    <text y="-18" text-anchor="middle" font-size="13" fill="#ffcc00" font-weight="600">AGENTS</text>
    <text y="0" text-anchor="middle" font-size="10" fill="#e8c870">particles · explosion · debris</text>
    <text y="14" text-anchor="middle" font-size="9" fill="#c0a050">starfield · environment FX</text>
    <text y="26" text-anchor="middle" font-size="9" fill="#a08840" opacity="0.85">*.js</text>
  </g>

  <!-- Game logic -->
  <g transform="translate(380 420)">
    <rect x="-130" y="-32" width="260" height="64" rx="8" fill="#1a1428" stroke="#bb88ff" stroke-width="1.6"/>
    <text y="-8" text-anchor="middle" font-size="13" fill="#bb88ff" font-weight="600">GAME LOGIC + STATE MACHINE</text>
    <text y="10" text-anchor="middle" font-size="10" fill="#a080c0">classifyTouchdown · score · lives</text>
    <text y="22" text-anchor="middle" font-size="9" fill="#7060a0" opacity="0.85">lunar-lander-demo.js</text>
  </g>

  <!-- Render pipeline -->
  <g transform="translate(820 420)">
    <rect x="-130" y="-32" width="260" height="64" rx="8" fill="#28140a" stroke="#ff8844" stroke-width="1.6"/>
    <text y="-8" text-anchor="middle" font-size="13" fill="#ff8844" font-weight="600">RENDER PIPELINE</text>
    <text y="10" text-anchor="middle" font-size="10" fill="#e0a070">starfield → world → device</text>
    <text y="22" text-anchor="middle" font-size="9" fill="#a87050" opacity="0.85">3-pass · COMPOSITE = R_y · D · W</text>
  </g>

  <!-- Profiles -->
  <g transform="translate(380 560)">
    <rect x="-100" y="-26" width="200" height="52" rx="8" fill="#102030" stroke="#7090b8" stroke-width="1.2"/>
    <text y="-6" text-anchor="middle" font-size="12" fill="#90b0d8" font-weight="600">PLANET PROFILES</text>
    <text y="12" text-anchor="middle" font-size="9" fill="#6080a0">gravity · drag · wind · hazards</text>
  </g>
  <g transform="translate(620 560)">
    <rect x="-100" y="-26" width="200" height="52" rx="8" fill="#102030" stroke="#7090b8" stroke-width="1.2"/>
    <text y="-6" text-anchor="middle" font-size="12" fill="#90b0d8" font-weight="600">COLOR PROFILES</text>
    <text y="12" text-anchor="middle" font-size="9" fill="#6080a0">semantic roles → palette</text>
  </g>
  <g transform="translate(860 560)">
    <rect x="-100" y="-26" width="200" height="52" rx="8" fill="#102030" stroke="#7090b8" stroke-width="1.2"/>
    <text y="-6" text-anchor="middle" font-size="12" fill="#90b0d8" font-weight="600">SFX MAP</text>
    <text y="12" text-anchor="middle" font-size="9" fill="#6080a0">{engine, booster, crash, …}</text>
  </g>

  <!-- Canvas -->
  <g transform="translate(600 660)">
    <rect x="-160" y="-22" width="320" height="44" rx="8" fill="#040810" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.8"/>
    <text y="6" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600" letter-spacing="2">p5 CANVAS · sk.* draw calls</text>
  </g>

  <!-- Arrows -->
  <g fill="none" stroke="#a8d8ff" stroke-width="1.4" marker-end="url(#ar)" opacity="0.85">
    <line x1="240" y1="220" x2="278" y2="220"/>
    <line x1="480" y1="220" x2="518" y2="220"/>
    <line x1="380" y1="262" x2="380" y2="386"/>
    <line x1="620" y1="262" x2="620" y2="402"/>
    <line x1="620" y1="402" x2="500" y2="448" stroke-dasharray="3 3"/>
    <line x1="860" y1="262" x2="820" y2="386"/>
    <line x1="380" y1="454" x2="380" y2="532"/>
    <line x1="620" y1="262" x2="620" y2="532" stroke-dasharray="3 3" opacity="0.5"/>
    <line x1="860" y1="262" x2="860" y2="532" stroke-dasharray="3 3" opacity="0.5"/>
    <line x1="380" y1="454" x2="690" y2="630"/>
    <line x1="820" y1="454" x2="600" y2="636"/>
  </g>

  <!-- Legend -->
  <g transform="translate(60 640)" font-size="10" fill="#7090b0">
    <text y="0" font-size="11" fill="#a0b8d8" font-weight="600">DATA FLOW</text>
    <line x1="0" y1="14" x2="30" y2="14" stroke="#a8d8ff" stroke-width="1.4" marker-end="url(#ar)"/>
    <text x="38" y="18">direct call</text>
    <line x1="0" y1="32" x2="30" y2="32" stroke="#a8d8ff" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ar)"/>
    <text x="38" y="36">read-only</text>
  </g>
</svg>
