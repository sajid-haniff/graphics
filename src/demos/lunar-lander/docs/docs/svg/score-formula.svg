<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="ui-monospace, monospace">
  <rect width="1200" height="540" fill="#040810"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" fill="#bbccee" letter-spacing="4">SCORE — FACTORS &amp; DERIVATION</text>

  <!-- Big formula -->
  <g transform="translate(600 130)">
    <rect x="-540" y="-46" width="1080" height="92" rx="10" fill="#06121e" stroke="#ffcc00" stroke-width="1.6"/>
    <text x="0" y="14" text-anchor="middle" font-size="22" fill="#ffcc00" font-weight="700" letter-spacing="2">
      score = round( BASE · m² · F · G )
    </text>
    <text x="0" y="36" text-anchor="middle" font-size="10" fill="#a89050">m = pad.mult   ·   F = fuelBonus   ·   G = gentleness</text>
  </g>

  <!-- Four factor boxes -->
  <g font-size="11">
    <g transform="translate(80 250)">
      <rect width="240" height="210" rx="8" fill="#0a1828" stroke="#88aacc" stroke-width="1.4"/>
      <text x="120" y="26" text-anchor="middle" font-size="13" fill="#a0c0e0" font-weight="600">BASE</text>
      <text x="120" y="44" text-anchor="middle" font-size="10" fill="#88aacc">flat per-landing reward</text>
      <text x="120" y="100" text-anchor="middle" font-size="36" fill="#a0c0e0" font-weight="700">100</text>
      <text x="120" y="160" text-anchor="middle" font-size="10" fill="#7090b0">independent of skill</text>
      <text x="120" y="176" text-anchor="middle" font-size="10" fill="#7090b0">always paid out</text>
    </g>

    <g transform="translate(340 250)">
      <rect width="240" height="210" rx="8" fill="#1a0820" stroke="#ff66cc" stroke-width="1.6"/>
      <text x="120" y="26" text-anchor="middle" font-size="13" fill="#ff66cc" font-weight="600">m² · multiplier</text>
      <text x="120" y="44" text-anchor="middle" font-size="10" fill="#e0a0d8">narrowness reward</text>
      <text x="120" y="96" text-anchor="middle" font-size="22" fill="#ff66cc" font-weight="700">1, 4, 9, 25</text>
      <text x="120" y="116" text-anchor="middle" font-size="10" fill="#c080b8">for mult = 1, 2, 3, 5</text>
      <text x="120" y="158" text-anchor="middle" font-size="10" fill="#c080b8">DOUBLE multiplication</text>
      <text x="120" y="174" text-anchor="middle" font-size="10" fill="#c080b8">→ sharp risk curve</text>
    </g>

    <g transform="translate(600 250)">
      <rect width="240" height="210" rx="8" fill="#28140a" stroke="#ffcc44" stroke-width="1.4"/>
      <text x="120" y="26" text-anchor="middle" font-size="13" fill="#ffcc44" font-weight="600">F · fuel bonus</text>
      <text x="120" y="44" text-anchor="middle" font-size="10" fill="#e8c870">efficiency reward</text>
      <text x="120" y="96" text-anchor="middle" font-size="20" fill="#ffcc44" font-weight="700">1 + fuel/fuel₀</text>
      <text x="120" y="116" text-anchor="middle" font-size="10" fill="#c0a050">range: [1, 2]</text>
      <text x="120" y="158" text-anchor="middle" font-size="10" fill="#c0a050">fly conservatively</text>
      <text x="120" y="174" text-anchor="middle" font-size="10" fill="#c0a050">→ ×2 reward</text>
    </g>

    <g transform="translate(860 250)">
      <rect width="240" height="210" rx="8" fill="#102818" stroke="#44ff88" stroke-width="1.4"/>
      <text x="120" y="26" text-anchor="middle" font-size="13" fill="#44ff88" font-weight="600">G · gentleness</text>
      <text x="120" y="44" text-anchor="middle" font-size="10" fill="#80e0a0">soft-touch reward</text>
      <text x="120" y="96" text-anchor="middle" font-size="18" fill="#44ff88" font-weight="700">1 − |vy|/vSafe</text>
      <text x="120" y="116" text-anchor="middle" font-size="10" fill="#60a070">clamped to [0, 1]</text>
      <text x="120" y="158" text-anchor="middle" font-size="10" fill="#60a070">a hard-but-safe</text>
      <text x="120" y="174" text-anchor="middle" font-size="10" fill="#60a070">landing scores low</text>
    </g>
  </g>

  <!-- Example bottom -->
  <g transform="translate(80 480)">
    <rect width="1040" height="50" rx="8" fill="#06121e" stroke="#2c4a6e" stroke-width="1"/>
    <text x="20" y="22" font-size="11" fill="#bbccee" font-weight="600">EXAMPLE</text>
    <text x="20" y="40" font-size="11" fill="#88aacc">5× pad, 60% fuel left, gentle landing → score = 100 · 25 · 1.60 · 0.85 = <tspan fill="#ffcc44" font-weight="600">3 400</tspan></text>
  </g>
</svg>
