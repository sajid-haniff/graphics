<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="ui-monospace, monospace">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#88ddff"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#040810"/>
  <text x="600" y="38" text-anchor="middle" font-size="18" fill="#bbccee" letter-spacing="5">FRAME LOOP — ONE TICK @ dt = 1/60 s</text>

  <!-- Phases -->
  <g font-size="11">
    <!-- 1: Input -->
    <g transform="translate(120 180)">
      <rect x="-60" y="-50" width="120" height="100" rx="6" fill="#0a1828" stroke="#86a7d8" stroke-width="1.4"/>
      <text y="-28" text-anchor="middle" fill="#86a7d8" font-weight="600" font-size="12">1 · INPUT</text>
      <text y="-8" text-anchor="middle" fill="#6b8aa8">read keys</text>
      <text y="6" text-anchor="middle" fill="#6b8aa8">→ thrust</text>
      <text y="20" text-anchor="middle" fill="#6b8aa8">→ rotL/rotR</text>
      <text y="38" text-anchor="middle" fill="#5a7090">SHIFT/CTRL → restart</text>
    </g>

    <!-- 2: Physics -->
    <g transform="translate(290 180)">
      <rect x="-60" y="-60" width="120" height="120" rx="6" fill="#0a2030" stroke="#00eeff" stroke-width="1.4"/>
      <text y="-38" text-anchor="middle" fill="#00eeff" font-weight="600" font-size="12">2 · PHYSICS</text>
      <text y="-16" text-anchor="middle" fill="#88c8e0">state =</text>
      <text y="0" text-anchor="middle" fill="#88c8e0">step(state,</text>
      <text y="14" text-anchor="middle" fill="#88c8e0">input, dt, env)</text>
      <text y="34" text-anchor="middle" fill="#6da4c0">collisions?</text>
      <text y="48" text-anchor="middle" fill="#6da4c0">→ classify</text>
    </g>

    <!-- 3: Camera -->
    <g transform="translate(460 180)">
      <rect x="-60" y="-50" width="120" height="100" rx="6" fill="#1a0a30" stroke="#bb88ff" stroke-width="1.4"/>
      <text y="-28" text-anchor="middle" fill="#bb88ff" font-weight="600" font-size="12">3 · CAMERA</text>
      <text y="-8" text-anchor="middle" fill="#a080c0">altitude</text>
      <text y="6" text-anchor="middle" fill="#a080c0">→ mode</text>
      <text y="20" text-anchor="middle" fill="#a080c0">→ target</text>
      <text y="38" text-anchor="middle" fill="#8060a0">expo-smooth</text>
    </g>

    <!-- 4: Terrain -->
    <g transform="translate(630 180)">
      <rect x="-60" y="-50" width="120" height="100" rx="6" fill="#1a0820" stroke="#ff66cc" stroke-width="1.4"/>
      <text y="-28" text-anchor="middle" fill="#ff66cc" font-weight="600" font-size="12">4 · TERRAIN</text>
      <text y="-8" text-anchor="middle" fill="#e0a0d8">ensure chunks</text>
      <text y="6" text-anchor="middle" fill="#e0a0d8">cover visible</text>
      <text y="20" text-anchor="middle" fill="#e0a0d8">window</text>
      <text y="38" text-anchor="middle" fill="#c080b8">prune offscreen</text>
    </g>

    <!-- 5: Agents -->
    <g transform="translate(800 180)">
      <rect x="-60" y="-60" width="120" height="120" rx="6" fill="#28140a" stroke="#ff8844" stroke-width="1.4"/>
      <text y="-38" text-anchor="middle" fill="#ff8844" font-weight="600" font-size="12">5 · AGENTS</text>
      <text y="-18" text-anchor="middle" fill="#e0a070">particles.update</text>
      <text y="-4" text-anchor="middle" fill="#e0a070">starfield.update</text>
      <text y="10" text-anchor="middle" fill="#e0a070">debris.update</text>
      <text y="24" text-anchor="middle" fill="#e0a070">explosion.update</text>
      <text y="44" text-anchor="middle" fill="#a87050">(if active)</text>
    </g>

    <!-- 6: Render -->
    <g transform="translate(970 180)">
      <rect x="-60" y="-60" width="120" height="120" rx="6" fill="#102818" stroke="#44ff88" stroke-width="1.4"/>
      <text y="-38" text-anchor="middle" fill="#44ff88" font-weight="600" font-size="12">6 · RENDER</text>
      <text y="-18" text-anchor="middle" fill="#80e0a0">A · starfield</text>
      <text y="-4" text-anchor="middle" fill="#80e0a0">B · world pass</text>
      <text y="10" text-anchor="middle" fill="#80e0a0">C · HUD/device</text>
      <text y="30" text-anchor="middle" fill="#60c080">push/pop</text>
      <text y="44" text-anchor="middle" fill="#60c080">discipline</text>
    </g>

    <!-- 7: HUD -->
    <g transform="translate(1100 180)">
      <rect x="-50" y="-50" width="100" height="100" rx="6" fill="#202008" stroke="#ffcc00" stroke-width="1.4"/>
      <text y="-28" text-anchor="middle" fill="#ffcc00" font-weight="600" font-size="12">7 · HUD</text>
      <text y="-8" text-anchor="middle" fill="#e8c870">altitude</text>
      <text y="6" text-anchor="middle" fill="#e8c870">velocity</text>
      <text y="20" text-anchor="middle" fill="#e8c870">fuel/score</text>
    </g>
  </g>

  <!-- Arrows -->
  <g fill="none" stroke="#88ddff" stroke-width="1.5" marker-end="url(#ar2)">
    <line x1="180" y1="180" x2="227" y2="180"/>
    <line x1="350" y1="180" x2="397" y2="180"/>
    <line x1="520" y1="180" x2="567" y2="180"/>
    <line x1="690" y1="180" x2="737" y2="180"/>
    <line x1="860" y1="180" x2="907" y2="180"/>
    <line x1="1030" y1="180" x2="1047" y2="180"/>
  </g>

  <!-- Loop back arrow -->
  <g fill="none" stroke="#7090c0" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar2)" opacity="0.8">
    <path d="M 1100 240 Q 1100 340 600 340 Q 120 340 120 240"/>
  </g>
  <text x="600" y="362" text-anchor="middle" font-size="11" fill="#7090c0">next frame · ~16.67 ms later</text>

  <!-- Timeline at bottom -->
  <g transform="translate(120 420)">
    <text x="0" y="-8" font-size="11" fill="#88aacc" font-weight="600">TIMING NOTES</text>
    <text x="0" y="12" font-size="10" fill="#7090b0">• dt is explicit everywhere — no implicit globals</text>
    <text x="0" y="28" font-size="10" fill="#7090b0">• semi-implicit Euler keeps energy bounded under conservative forces</text>
    <text x="0" y="44" font-size="10" fill="#7090b0">• damping uses exp(-k·dt) — frame-rate independent at any legal dt</text>
    <text x="0" y="60" font-size="10" fill="#7090b0">• rendering reads physics state read-only — no mutation in display()</text>
  </g>
</svg>
