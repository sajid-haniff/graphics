<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="ui-monospace, monospace">
  <defs>
    <marker id="arTh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffcc44"/>
    </marker>
    <marker id="arG2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#88aacc"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#040810"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" fill="#bbccee" letter-spacing="4">THRUST VECTOR — ROTATING BODY-LOCAL +Y</text>
  <text x="600" y="56" text-anchor="middle" font-size="11" fill="#6b8aa8">thrustDir(θ) = (sin θ, cos θ)     ·     same θ that rotates the body</text>

  <!-- Three orientations -->
  <g>
    <!-- Upright -->
    <g transform="translate(200 320)">
      <circle r="120" fill="none" stroke="#2c4a6e" stroke-width="0.8" stroke-dasharray="3 3"/>
      <text x="0" y="-140" text-anchor="middle" font-size="12" fill="#88c8e0" font-weight="600">θ = 0</text>
      <text x="0" y="-124" text-anchor="middle" font-size="9" fill="#7090b0">thrustDir = (0, 1)</text>

      <!-- body -->
      <g stroke="#00eeff" stroke-width="1.6" fill="none">
        <polygon points="-12,-18 12,-18 16,-2 12,16 -12,16 -16,-2"/>
        <line x1="-12" y1="16" x2="-22" y2="28"/>
        <line x1="12" y1="16" x2="22" y2="28"/>
        <line x1="-28" y1="28" x2="-16" y2="28"/>
        <line x1="16" y1="28" x2="28" y2="28"/>
      </g>

      <!-- thrust arrow -->
      <line x1="0" y1="20" x2="0" y2="100" stroke="#ffcc44" stroke-width="3" marker-end="url(#arTh)"/>
      <text x="14" y="80" font-size="10" fill="#ffcc44">F_thrust</text>

      <!-- gravity arrow -->
      <line x1="-60" y1="-60" x2="-60" y2="40" stroke="#88aacc" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arG2)"/>
      <text x="-90" y="-30" font-size="9" fill="#88aacc">g</text>
    </g>

    <!-- Tilted right -->
    <g transform="translate(600 320)">
      <circle r="120" fill="none" stroke="#2c4a6e" stroke-width="0.8" stroke-dasharray="3 3"/>
      <text x="0" y="-140" text-anchor="middle" font-size="12" fill="#ff66cc" font-weight="600">θ = +45°</text>
      <text x="0" y="-124" text-anchor="middle" font-size="9" fill="#e0a0d8">thrustDir = (sin θ, cos θ)</text>

      <g transform="rotate(45)" stroke="#ff66cc" stroke-width="1.6" fill="none">
        <polygon points="-12,-18 12,-18 16,-2 12,16 -12,16 -16,-2"/>
        <line x1="-12" y1="16" x2="-22" y2="28"/>
        <line x1="12" y1="16" x2="22" y2="28"/>
        <line x1="-28" y1="28" x2="-16" y2="28"/>
        <line x1="16" y1="28" x2="28" y2="28"/>
      </g>

      <line x1="0" y1="0" x2="56.6" y2="56.6" stroke="#ffcc44" stroke-width="3" marker-end="url(#arTh)" transform="translate(0 20) rotate(-90)"/>
      <text x="60" y="74" font-size="10" fill="#ffcc44">F_thrust</text>

      <line x1="-60" y1="-60" x2="-60" y2="40" stroke="#88aacc" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arG2)"/>
    </g>

    <!-- Tilted left -->
    <g transform="translate(1000 320)">
      <circle r="120" fill="none" stroke="#2c4a6e" stroke-width="0.8" stroke-dasharray="3 3"/>
      <text x="0" y="-140" text-anchor="middle" font-size="12" fill="#44ff88" font-weight="600">θ = −45°</text>
      <text x="0" y="-124" text-anchor="middle" font-size="9" fill="#80c080">thrust pushes up-and-left</text>

      <g transform="rotate(-45)" stroke="#44ff88" stroke-width="1.6" fill="none">
        <polygon points="-12,-18 12,-18 16,-2 12,16 -12,16 -16,-2"/>
        <line x1="-12" y1="16" x2="-22" y2="28"/>
        <line x1="12" y1="16" x2="22" y2="28"/>
        <line x1="-28" y1="28" x2="-16" y2="28"/>
        <line x1="16" y1="28" x2="28" y2="28"/>
      </g>

      <g transform="rotate(-45)">
        <line x1="0" y1="20" x2="0" y2="100" stroke="#ffcc44" stroke-width="3" marker-end="url(#arTh)"/>
      </g>
      <text x="-80" y="78" font-size="10" fill="#ffcc44">F_thrust</text>

      <line x1="60" y1="-60" x2="60" y2="40" stroke="#88aacc" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arG2)"/>
    </g>
  </g>

  <!-- Math panel -->
  <g transform="translate(80 480)">
    <rect width="1040" height="100" rx="8" fill="#06121e" stroke="#2c4a6e" stroke-width="1"/>
    <text x="20" y="22" font-size="12" fill="#a0c0e0" font-weight="600">UPDATE — applied each tick when thrust input is on AND fuel &gt; 0</text>
    <text x="20" y="46" font-size="11" fill="#bbccee">a = (0, −g) + thrust · (sin θ, cos θ) / m  +  drag/wind  +  (rotation torque from input)</text>
    <text x="20" y="68" font-size="11" fill="#88aacc">fuel ← fuel − burnRate · dt           thrustOn ← (input.thrust ∧ fuel &gt; 0)</text>
    <text x="20" y="86" font-size="10" fill="#7090b0">Note: sin/cos pair reflects the CW convention (positive θ → +x component). Standard CCW math would give (−sin θ, cos θ).</text>
  </g>
</svg>
