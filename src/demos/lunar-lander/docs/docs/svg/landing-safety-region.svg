<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="ui-monospace, monospace">
  <defs>
    <linearGradient id="safeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44ff88" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#44ff88" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="#040810"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" fill="#bbccee" letter-spacing="4">LANDING SAFETY REGION — INTERSECTION OF HALF-SPACES</text>
  <text x="600" y="56" text-anchor="middle" font-size="11" fill="#6b8aa8">contact ∧ |vy| ≤ vSafe ∧ |vx| ≤ vxSafe ∧ |θ| ≤ θMax ∧ on-pad  ⇒  LANDED</text>

  <!-- vy vs vx box -->
  <g transform="translate(260 320)">
    <text x="0" y="-200" text-anchor="middle" font-size="13" fill="#88c8e0" font-weight="600">VELOCITY GATE  (vx, vy)</text>

    <!-- axes -->
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#446080" stroke-width="0.8"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#446080" stroke-width="0.8"/>
    <text x="184" y="-6" font-size="10" fill="#88aacc">vx</text>
    <text x="6" y="-180" font-size="10" fill="#88aacc">vy</text>

    <!-- Safe rectangle -->
    <rect x="-70" y="-90" width="140" height="180" fill="url(#safeFill)" stroke="#44ff88" stroke-width="2"/>

    <!-- Crashed region examples -->
    <g fill="#ff4466">
      <circle cx="100" cy="-30" r="3"/>
      <circle cx="-90" cy="40" r="3"/>
      <circle cx="30" cy="130" r="3"/>
      <circle cx="-130" cy="-110" r="3"/>
    </g>
    <g fill="#44ff88">
      <circle cx="20" cy="40" r="3"/>
      <circle cx="-30" cy="60" r="3"/>
      <circle cx="40" cy="-30" r="3"/>
    </g>

    <text x="0" y="-100" text-anchor="middle" font-size="9" fill="#80c080">|vx| ≤ vxSafe</text>
    <text x="80" y="-94" text-anchor="start" font-size="9" fill="#80c080" transform="rotate(-90 80 -94)">|vy| ≤ vSafe</text>

    <text x="0" y="220" text-anchor="middle" font-size="10" fill="#7090b0">downward (negative vy) allowed up to vSafe</text>
  </g>

  <!-- theta gate -->
  <g transform="translate(720 320)">
    <text x="0" y="-200" text-anchor="middle" font-size="13" fill="#bb88ff" font-weight="600">ORIENTATION GATE  |θ| ≤ θMax</text>

    <!-- Half-circle of orientations -->
    <circle r="140" fill="none" stroke="#604080" stroke-width="0.8" stroke-dasharray="3 4"/>
    <!-- Safe arc (θ small both sides) -->
    <path d="M 0 -140
             A 140 140 0 0 1 90 -107
             L 0 0 Z"
          fill="#44ff88" opacity="0.25" stroke="none"/>
    <path d="M 0 -140
             A 140 140 0 0 0 -90 -107
             L 0 0 Z"
          fill="#44ff88" opacity="0.25" stroke="none"/>

    <!-- Boundary lines -->
    <line x1="0" y1="0" x2="0" y2="-140" stroke="#7090b0" stroke-width="0.8" stroke-dasharray="3 3"/>
    <line x1="0" y1="0" x2="90" y2="-107" stroke="#44ff88" stroke-width="2"/>
    <line x1="0" y1="0" x2="-90" y2="-107" stroke="#44ff88" stroke-width="2"/>
    <line x1="0" y1="0" x2="120" y2="72" stroke="#ff4466" stroke-width="1.4"/>
    <line x1="0" y1="0" x2="-120" y2="72" stroke="#ff4466" stroke-width="1.4"/>

    <!-- Lander sketches -->
    <g transform="translate(0 -160)"><polygon points="-6,8 6,8 5,-8 -5,-8" fill="none" stroke="#44ff88" stroke-width="1.6"/></g>
    <g transform="translate(75 -90) rotate(35)"><polygon points="-6,8 6,8 5,-8 -5,-8" fill="none" stroke="#44ff88" stroke-width="1.4"/></g>
    <g transform="translate(-75 -90) rotate(-35)"><polygon points="-6,8 6,8 5,-8 -5,-8" fill="none" stroke="#44ff88" stroke-width="1.4"/></g>
    <g transform="translate(140 90) rotate(120)"><polygon points="-6,8 6,8 5,-8 -5,-8" fill="none" stroke="#ff4466" stroke-width="1.4"/></g>

    <text x="0" y="-160" text-anchor="middle" font-size="10" fill="#80c080">upright</text>
    <text x="0" y="14" text-anchor="middle" font-size="10" fill="#a080c0">θ = 0</text>
    <text x="100" y="100" font-size="10" fill="#ff8899">tipped</text>
    <text x="-130" y="100" font-size="10" fill="#ff8899">tipped</text>
    <text x="0" y="220" text-anchor="middle" font-size="10" fill="#9070a0">cone of allowed orientations · θMax depends on profile</text>
  </g>

  <!-- Bottom predicate -->
  <g transform="translate(80 480)">
    <rect width="1040" height="80" rx="8" fill="#06121e" stroke="#2c4a6e" stroke-width="1"/>
    <text x="20" y="24" font-size="12" fill="#a0c0e0" font-weight="600">FULL PREDICATE — classifyTouchdown(state, pad, profile)</text>
    <text x="20" y="48" font-size="11" fill="#88aacc">safe = contact ∧ (state.v.y ≥ −vSafe) ∧ (|state.v.x| ≤ vxSafe) ∧ (|state.θ| ≤ θMax) ∧ (|state.x − pad.x| ≤ pad.w / 2)</text>
    <text x="20" y="68" font-size="10" fill="#7090b0">A single conjunctive AND-chain — every clause is a half-space. Their intersection is the convex safe region.</text>
  </g>
</svg>
