<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" style="background:#040810;font-family:monospace">

  <text x="360" y="28" text-anchor="middle" fill="#bbccee" font-size="13" letter-spacing="2">LANDER DYNAMICS   ·   EQUATIONS OF MOTION</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LEFT: State vector box -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(30,50)">
    <text x="100" y="0" text-anchor="middle" fill="#5577aa" font-size="11" letter-spacing="1">STATE VECTOR  s</text>
    <rect x="0" y="8" width="200" height="140" rx="6" fill="#0a1525" stroke="#5577aa" stroke-width="1.2"/>

    <text x="16" y="30"  fill="#00eeff" font-size="11">pos   [x, y]</text>
    <text x="16" y="47"  fill="#bbccee" font-size="9"  opacity="0.7">lander centre, Y-up (metres)</text>

    <text x="16" y="66"  fill="#00eeff" font-size="11">vel   [vx, vy]</text>
    <text x="16" y="83"  fill="#bbccee" font-size="9"  opacity="0.7">linear velocity  m/s</text>

    <text x="16" y="102" fill="#00eeff" font-size="11">theta  θ  (rad)</text>
    <text x="16" y="119" fill="#bbccee" font-size="9"  opacity="0.7">0 = nose +Y,  +θ = nose → +X</text>

    <text x="16" y="133" fill="#00eeff" font-size="11">omega  ω  (rad/s)</text>

    <text x="190" y="8" fill="#bbccee" font-size="9" opacity="0.5" text-anchor="end">ℝ⁷</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- CENTRE TOP: Thrust direction geometry -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(275,50)">
    <text x="90" y="0" text-anchor="middle" fill="#5577aa" font-size="11" letter-spacing="1">HEADING CONVENTION</text>
    <rect x="0" y="8" width="180" height="145" rx="6" fill="#0a1525" stroke="#5577aa" stroke-width="1.2"/>

    <!-- lander at theta=0 -->
    <g transform="translate(55,80)">
      <!-- body outline -->
      <polygon points="0,-30 16,-9 20,13 0,23 -20,13 -16,-9"
               fill="none" stroke="#00eeff" stroke-width="1.6"/>
      <!-- legs -->
      <line x1="-20" y1="13" x2="-34" y2="38" stroke="#00eeff" stroke-width="1.2"/>
      <line x1="20"  y1="13" x2="34"  y2="38" stroke="#00eeff" stroke-width="1.2"/>
      <!-- +Y axis -->
      <line x1="0" y1="-30" x2="0" y2="-55" stroke="#5577aa" stroke-width="1" stroke-dasharray="3,2"/>
      <polygon points="0,-60 -3,-52 3,-52" fill="#5577aa"/>
      <text x="4" y="-50" fill="#5577aa" font-size="9">+Y</text>
      <!-- thrust arrow at theta=0 -->
      <line x1="0" y1="23" x2="0" y2="55" stroke="#ff9933" stroke-width="2" stroke-dasharray="4,2"/>
      <polygon points="0,60 -4,51 4,51" fill="#ff9933"/>
      <text x="4" y="58" fill="#ff9933" font-size="9">thrust</text>
    </g>

    <!-- lander at theta=+45° (rotated) -->
    <g transform="translate(135,80) rotate(35)">
      <polygon points="0,-30 16,-9 20,13 0,23 -20,13 -16,-9"
               fill="none" stroke="#00eeff" stroke-width="1.2" opacity="0.45"/>
      <line x1="-20" y1="13" x2="-34" y2="38" stroke="#00eeff" stroke-width="1" opacity="0.45"/>
      <line x1="20"  y1="13" x2="34"  y2="38" stroke="#00eeff" stroke-width="1" opacity="0.45"/>
    </g>

    <!-- theta arc -->
    <path d="M 55,50 A 28,28 0 0 1 72,28" fill="none" stroke="#ffcc00" stroke-width="1.2"/>
    <text x="68" y="46" fill="#ffcc00" font-size="9">+θ</text>

    <!-- formula box bottom -->
    <rect x="8" y="120" width="164" height="26" rx="4" fill="#040d1a" stroke="#5577aa" stroke-width="0.7"/>
    <text x="90" y="133" text-anchor="middle" fill="#ff9933" font-size="10">thrustDir(θ) = [sin θ, cos θ]</text>
    <text x="90" y="143" text-anchor="middle" fill="#bbccee" font-size="8" opacity="0.7">nose up at θ=0  →  consistent with Y-up</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- RIGHT: Acceleration decomposition -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(490,50)">
    <text x="105" y="0" text-anchor="middle" fill="#5577aa" font-size="11" letter-spacing="1">LINEAR ACCELERATION</text>
    <rect x="0" y="8" width="210" height="145" rx="6" fill="#0a1525" stroke="#5577aa" stroke-width="1.2"/>

    <!-- gravity arrow -->
    <line x1="105" y1="36" x2="105" y2="80" stroke="#ff4444" stroke-width="1.8"/>
    <polygon points="105,86 100,74 110,74" fill="#ff4444"/>
    <text x="112" y="68" fill="#ff4444" font-size="10">g = 1.62 m/s²</text>
    <text x="112" y="80" fill="#ff4444" font-size="9" opacity="0.7">(Moon surface)</text>

    <!-- thrust arrow at angle -->
    <line x1="105" y1="90" x2="126" y2="44" stroke="#ff9933" stroke-width="1.8"/>
    <polygon points="127,40 116,46 129,51" fill="#ff9933"/>
    <text x="132" y="44" fill="#ff9933" font-size="10">T·sin θ</text>
    <text x="132" y="54" fill="#ff9933" font-size="10">T·cos θ</text>

    <!-- combined arrow -->
    <line x1="105" y1="90" x2="118" y2="52" stroke="#00eeff" stroke-width="2"/>
    <polygon points="119,48 111,55 121,58" fill="#00eeff" opacity="0.7"/>

    <!-- formulas -->
    <rect x="8" y="108" width="194" height="38" rx="4" fill="#040d1a" stroke="#5577aa" stroke-width="0.7"/>
    <text x="100" y="121" text-anchor="middle" fill="#bbccee" font-size="10">ax = τ · T · sin θ</text>
    <text x="100" y="134" text-anchor="middle" fill="#bbccee" font-size="10">ay = − g_moon + τ · T · cos θ</text>
    <text x="100" y="145" text-anchor="middle" fill="#ff9933" font-size="8" opacity="0.7">τ ∈ {0, 1}  (binary throttle, v1)</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- BOTTOM: Semi-implicit Euler + Angular -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Semi-implicit Euler box -->
  <g transform="translate(30,230)">
    <text x="195" y="0" text-anchor="middle" fill="#5577aa" font-size="11" letter-spacing="1">SEMI-IMPLICIT EULER  (translation)</text>
    <rect x="0" y="8" width="390" height="105" rx="6" fill="#0a1525" stroke="#5577aa" stroke-width="1.2"/>

    <text x="16" y="30" fill="#bbccee" font-size="10" opacity="0.6">// velocity updated FIRST from acceleration</text>
    <text x="16" y="47" fill="#00eeff" font-size="12">vx′  =  vx  +  ax · dt</text>
    <text x="16" y="63" fill="#00eeff" font-size="12">vy′  =  vy  +  ay · dt</text>
    <text x="16" y="82" fill="#bbccee" font-size="10" opacity="0.6">// position uses the UPDATED velocity  (semi-implicit)</text>
    <text x="16" y="99" fill="#00eeff" font-size="12">x′   =  x   +  vx′· dt</text>
    <text x="216" y="99" fill="#00eeff" font-size="12">y′  =  y  +  vy′· dt</text>

    <!-- "why semi-implicit" callout -->
    <rect x="260" y="25" width="124" height="50" rx="4" fill="#0d1e35" stroke="#ffcc00" stroke-width="0.8"/>
    <text x="270" y="39" fill="#ffcc00" font-size="9">vs. explicit Euler:</text>
    <text x="270" y="51" fill="#bbccee" font-size="8">implicit step conserves</text>
    <text x="270" y="62" fill="#bbccee" font-size="8">energy better — no</text>
    <text x="270" y="73" fill="#bbccee" font-size="8">artificial spiral-out</text>
  </g>

  <!-- Angular dynamics box -->
  <g transform="translate(440,230)">
    <text x="135" y="0" text-anchor="middle" fill="#5577aa" font-size="11" letter-spacing="1">ANGULAR DYNAMICS</text>
    <rect x="0" y="8" width="270" height="105" rx="6" fill="#0a1525" stroke="#5577aa" stroke-width="1.2"/>

    <text x="12" y="27" fill="#bbccee" font-size="10" opacity="0.6">// RCS torque → damping → clamp → integrate</text>
    <text x="12" y="44" fill="#00eeff" font-size="11">ω′  =  ω  +  α_rcs · dt</text>
    <text x="12" y="60" fill="#00eeff" font-size="11">ω′  ×= exp(−k · dt)</text>
    <text x="12" y="74" fill="#bbccee" font-size="9" opacity="0.7">// exact solution to dω/dt = −kω (frame-rate indep.)</text>
    <text x="12" y="88" fill="#00eeff" font-size="11">ω′  =  clamp(ω′, −ω_max, ω_max)</text>
    <text x="12" y="103" fill="#00eeff" font-size="11">θ′  =  θ  +  ω′· dt</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- BOTTOM ROW: Safe landing region -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(30,370)">
    <text x="330" y="0" text-anchor="middle" fill="#5577aa" font-size="11" letter-spacing="1">SAFE LANDING  ·  HALF-SPACE REGION IN  (vx, vy, θ, ω)</text>
    <rect x="0" y="8" width="660" height="82" rx="6" fill="#0a1525" stroke="#44ff88" stroke-width="1.2"/>

    <!-- five conditions as green checks -->
    <text x="16"  y="28" fill="#44ff88" font-size="11">│vy│ ≤ 2.5 m/s</text>
    <text x="145" y="28" fill="#44ff88" font-size="11">│vx│ ≤ 1.5 m/s</text>
    <text x="274" y="28" fill="#44ff88" font-size="11">│θ│ ≤ 15°</text>
    <text x="370" y="28" fill="#44ff88" font-size="11">│ω│ ≤ 0.5 rad/s</text>
    <text x="498" y="28" fill="#44ff88" font-size="11">x ∈ [pad.x1, pad.x2]</text>

    <text x="330" y="50" text-anchor="middle" fill="#bbccee" font-size="9" opacity="0.6">ALL five conditions must hold simultaneously  →  verdict = 'safe'</text>
    <text x="330" y="65" text-anchor="middle" fill="#bbccee" font-size="9" opacity="0.6">ANY violation  →  verdict = 'crash'    (including: not over any pad)</text>
    <text x="330" y="80" text-anchor="middle" fill="#ff4444" font-size="9" opacity="0.7">classifyTouchdown(state, pad) → 'safe' | 'crash'</text>
  </g>

</svg>
