<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" style="background:#040810;font-family:monospace">

  <text x="360" y="26" text-anchor="middle" fill="#bbccee" font-size="13" letter-spacing="2">TERRAIN GENERATION   ·   PROCEDURAL PIPELINE</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- PIPELINE FLOW (top row) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Step 1: LCG Seed -->
  <g transform="translate(14,44)">
    <rect x="0" y="0" width="96" height="52" rx="5" fill="#0a1525" stroke="#5577aa" stroke-width="1.2"/>
    <text x="48" y="16" text-anchor="middle" fill="#5577aa" font-size="9" letter-spacing="1">SEED</text>
    <text x="48" y="30" text-anchor="middle" fill="#00eeff" font-size="10">LCG(seed)</text>
    <text x="48" y="44" text-anchor="middle" fill="#bbccee" font-size="8" opacity="0.7">deterministic</text>
  </g>
  <line x1="110" y1="70" x2="126" y2="70" stroke="#5577aa" stroke-width="1.2"/>
  <polygon points="130,70 122,66 122,74" fill="#5577aa"/>

  <!-- Step 2: fBm -->
  <g transform="translate(130,44)">
    <rect x="0" y="0" width="96" height="52" rx="5" fill="#0a1525" stroke="#5577aa" stroke-width="1.2"/>
    <text x="48" y="16" text-anchor="middle" fill="#5577aa" font-size="9" letter-spacing="1">fBm TEXTURE</text>
    <text x="48" y="30" text-anchor="middle" fill="#00eeff" font-size="10">5 octaves</text>
    <text x="48" y="44" text-anchor="middle" fill="#bbccee" font-size="8" opacity="0.7">base + detail</text>
  </g>
  <line x1="226" y1="70" x2="242" y2="70" stroke="#5577aa" stroke-width="1.2"/>
  <polygon points="246,70 238,66 238,74" fill="#5577aa"/>

  <!-- Step 3: Gaussians -->
  <g transform="translate(246,44)">
    <rect x="0" y="0" width="96" height="52" rx="5" fill="#0a1525" stroke="#5577aa" stroke-width="1.2"/>
    <text x="48" y="16" text-anchor="middle" fill="#5577aa" font-size="9" letter-spacing="1">LANDFORMS</text>
    <text x="48" y="30" text-anchor="middle" fill="#00eeff" font-size="10">Gaussians</text>
    <text x="48" y="44" text-anchor="middle" fill="#bbccee" font-size="8" opacity="0.7">gorges + peaks</text>
  </g>
  <line x1="342" y1="70" x2="358" y2="70" stroke="#5577aa" stroke-width="1.2"/>
  <polygon points="362,70 354,66 354,74" fill="#5577aa"/>

  <!-- Step 4: Slope limit -->
  <g transform="translate(362,44)">
    <rect x="0" y="0" width="96" height="52" rx="5" fill="#0a1525" stroke="#5577aa" stroke-width="1.2"/>
    <text x="48" y="16" text-anchor="middle" fill="#5577aa" font-size="9" letter-spacing="1">SLOPE LIMIT</text>
    <text x="48" y="30" text-anchor="middle" fill="#00eeff" font-size="10">limitSlopes</text>
    <text x="48" y="44" text-anchor="middle" fill="#bbccee" font-size="8" opacity="0.7">max ΔY per step</text>
  </g>
  <line x1="458" y1="70" x2="474" y2="70" stroke="#5577aa" stroke-width="1.2"/>
  <polygon points="478,70 470,66 470,74" fill="#5577aa"/>

  <!-- Step 5: Pad carve -->
  <g transform="translate(478,44)">
    <rect x="0" y="0" width="96" height="52" rx="5" fill="#0a1525" stroke="#44ff88" stroke-width="1.2"/>
    <text x="48" y="16" text-anchor="middle" fill="#44ff88" font-size="9" letter-spacing="1">PAD CARVE</text>
    <text x="48" y="30" text-anchor="middle" fill="#00eeff" font-size="10">4 types</text>
    <text x="48" y="44" text-anchor="middle" fill="#bbccee" font-size="8" opacity="0.7">score × difficulty</text>
  </g>
  <line x1="574" y1="70" x2="590" y2="70" stroke="#5577aa" stroke-width="1.2"/>
  <polygon points="594,70 586,66 586,74" fill="#5577aa"/>

  <!-- Step 6: Output -->
  <g transform="translate(594,44)">
    <rect x="0" y="0" width="112" height="52" rx="5" fill="#0a1525" stroke="#00eeff" stroke-width="1.4"/>
    <text x="56" y="16" text-anchor="middle" fill="#00eeff" font-size="9" letter-spacing="1">OUTPUT</text>
    <text x="56" y="30" text-anchor="middle" fill="#bbccee" font-size="9">{ vertices, pads,</text>
    <text x="56" y="44" text-anchor="middle" fill="#bbccee" font-size="9">  bounds }</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- fBm visual (octave diagram) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(14,125)">
    <text x="160" y="0" text-anchor="middle" fill="#5577aa" font-size="11" letter-spacing="1">FRACTAL BROWNIAN MOTION  (fBm)   5 octaves</text>
    <rect x="0" y="8" width="320" height="130" rx="6" fill="#0a1525" stroke="#5577aa" stroke-width="1.2"/>

    <!-- Octave 0: low freq, large amp -->
    <polyline points="10,70 42,52 74,74 106,48 138,64 170,42 202,60 234,46 266,68 298,56 310,62"
              fill="none" stroke="#00eeff" stroke-width="2.2" opacity="0.9"/>
    <text x="10" y="128" fill="#00eeff" font-size="9">oct 0   amp=1   freq=1</text>

    <!-- Octave 1 (overlaid, thinner) -->
    <polyline points="10,62 26,58 42,66 58,54 74,70 90,60 106,52 122,64 138,58 154,50 170,60 186,56 202,64 218,58 234,50 250,62 266,58 282,64 298,60 310,54"
              fill="none" stroke="#5577aa" stroke-width="1.3" opacity="0.7"/>
    <text x="10" y="138" fill="#5577aa" font-size="9">oct 1   amp=½   freq=2</text>

    <!-- Octave 2+ (even thinner, suggestion) -->
    <polyline points="10,64 18,60 26,66 34,58 42,64 50,56 58,62 66,68 74,60 82,66 90,58 98,64 106,60 114,56 122,62 130,58 138,64 146,60 154,56 162,62 170,58 178,64 186,60 194,56 202,62 210,58 218,64 226,60 234,56 242,62 250,58 258,64 266,60 274,56 282,62 290,60 298,56 306,62 310,60"
              fill="none" stroke="#5577aa" stroke-width="0.8" opacity="0.4"/>
    <text x="180" y="128" fill="#5577aa" font-size="9" opacity="0.6">oct 2…4   amp→0   freq↑</text>

    <!-- Sum label -->
    <text x="160" y="112" text-anchor="middle" fill="#ffcc00" font-size="9">sum / norm_factor  →  [−1, 1]  height contribution</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Gaussian landform visual -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(354,125)">
    <text x="175" y="0" text-anchor="middle" fill="#5577aa" font-size="11" letter-spacing="1">GAUSSIAN LANDFORMS  (gorges + peaks)</text>
    <rect x="0" y="8" width="352" height="130" rx="6" fill="#0a1525" stroke="#5577aa" stroke-width="1.2"/>

    <!-- baseline -->
    <line x1="10" y1="80" x2="342" y2="80" stroke="#5577aa" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.4"/>

    <!-- fBm base terrain (flat-ish) -->
    <polyline points="10,78 50,72 90,80 130,74 170,78 210,74 250,80 290,76 330,78 342,80"
              fill="none" stroke="#5577aa" stroke-width="1.4" opacity="0.5" stroke-dasharray="5,3"/>

    <!-- mountain (Gaussian addition) -->
    <path d="M 30,80 Q 80,20 130,80" fill="none" stroke="#00eeff" stroke-width="2.2"/>
    <text x="74" y="32" fill="#00eeff" font-size="9" text-anchor="middle">peak</text>
    <text x="74" y="42" fill="#00eeff" font-size="8" text-anchor="middle">+h·G(x,cx,w)</text>

    <!-- gorge (Gaussian subtraction) -->
    <path d="M 160,80 Q 210,135 260,80" fill="none" stroke="#ff4444" stroke-width="2.2"/>
    <text x="210" y="132" fill="#ff4444" font-size="9" text-anchor="middle">gorge</text>
    <text x="210" y="122" fill="#ff4444" font-size="8" text-anchor="middle">−d·G(x,cx,w)</text>

    <!-- peak 2 -->
    <path d="M 270,80 Q 306,38 342,80" fill="none" stroke="#00eeff" stroke-width="1.8" opacity="0.7"/>

    <!-- combined result -->
    <polyline points="10,78 30,78 80,22 130,78 160,78 210,134 260,78 270,78 306,40 342,78"
              fill="none" stroke="#ffcc00" stroke-width="2" stroke-dasharray="6,2"/>
    <text x="175" y="116" fill="#ffcc00" font-size="9" text-anchor="middle">combined profile  (fBm + Gaussians)</text>

    <!-- G formula -->
    <rect x="8" y="88" width="180" height="22" rx="4" fill="#040d1a" stroke="#5577aa" stroke-width="0.6"/>
    <text x="16" y="102" fill="#bbccee" font-size="10">G(x, cx, w) = exp(−(x−cx)²/ 2w²)</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- PAD placement / scoring -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(14,286)">
    <text x="350" y="0" text-anchor="middle" fill="#5577aa" font-size="11" letter-spacing="1">LANDING PAD PLACEMENT   ·   DIFFICULTY &amp; SCORE</text>
    <rect x="0" y="8" width="692" height="185" rx="6" fill="#0a1525" stroke="#5577aa" stroke-width="1.2"/>

    <!-- Terrain cross-section showing pad types -->
    <!-- terrain outline -->
    <polyline points="10,120 50,85 90,130 130,90 155,92 185,92 220,100 260,70 300,115 335,78 370,80 410,80 445,88 480,60 520,50 540,52 570,52 600,65 640,100 680,100"
              fill="none" stroke="#5577aa" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- EASY pad (wide, low) -->
    <line x1="90" y1="130" x2="155" y2="130" stroke="#44ff88" stroke-width="3.5"/>
    <line x1="90" y1="130" x2="90"  y2="92"  stroke="#5577aa" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>
    <line x1="155" y1="130" x2="155" y2="92"  stroke="#5577aa" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>
    <text x="122" y="148" text-anchor="middle" fill="#44ff88" font-size="10">EASY  1X</text>
    <text x="122" y="160" text-anchor="middle" fill="#44ff88" font-size="8" opacity="0.7">wide · low · shelf</text>

    <!-- MEDIUM pad -->
    <line x1="300" y1="115" x2="350" y2="115" stroke="#ffcc00" stroke-width="3"/>
    <text x="325" y="133" text-anchor="middle" fill="#ffcc00" font-size="10">MED 2X</text>
    <text x="325" y="145" text-anchor="middle" fill="#ffcc00" font-size="8" opacity="0.7">narrower</text>

    <!-- HARD pad -->
    <line x1="370" y1="80" x2="410" y2="80" stroke="#ffcc00" stroke-width="2.5"/>
    <text x="390" y="98" text-anchor="middle" fill="#ff9933" font-size="10">HARD 3X</text>
    <text x="390" y="110" text-anchor="middle" fill="#ff9933" font-size="8" opacity="0.7">high / between slopes</text>

    <!-- EXPERT pad (very narrow, high) -->
    <line x1="525" y1="50" x2="570" y2="50" stroke="#ff4444" stroke-width="2"/>
    <text x="548" y="42" text-anchor="middle" fill="#ff4444" font-size="10">EXPERT 5X</text>
    <text x="548" y="68" text-anchor="middle" fill="#ff4444" font-size="8" opacity="0.7">very narrow · exposed</text>

    <!-- Scoring formula -->
    <rect x="8" y="165" width="676" height="20" rx="4" fill="#040d1a" stroke="#5577aa" stroke-width="0.6"/>
    <text x="346" y="179" text-anchor="middle" fill="#bbccee" font-size="9">
      score = (BASE + fuel_bonus + precision_bonus + softness_bonus) × multiplier     ←     risk/reward encoded in pad.multiplier
    </text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Infinite chunking note -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(14,468)">
    <rect x="0" y="0" width="692" height="24" rx="4" fill="#0a1525" stroke="#5577aa" stroke-width="0.8"/>
    <text x="346" y="15" text-anchor="middle" fill="#bbccee" font-size="9">
      Infinite scrolling:  getChunk(i) lazy-generates chunk i on demand, stitching boundary vertices for C⁰ continuity.  Chunk seed = mixSeed(masterSeed, i).
    </text>
  </g>

</svg>
